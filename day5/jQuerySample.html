<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>jQuery実装</title>

    <!--jQuery読み込み設定-->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <!--box用css-->
    <style>
        #box {
            width: 200px;
            height: 200px;
            background-color: skyblue;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>jQuery実装</h1>

    <h2>jQueryでの基本操作</h2>
    <button id="btn">ボタン1</button>
    <p id="msg">message</p>
    <script>
        $(function () {
            $("#btn").click(function () {
                $("#msg").text("ボタン1がクリックされた！");
            });
        });
    </script>

    <h2>jQueryを使った簡単なアニメーション </h2>
    <button id="showBtn">show()</button>
    <button id="hideBtn">hide()</button>
    <button id="fadeInBtn">fadeIn()</button>
    <button id="fadeOutBtn">fadeOut()</button>

    <div id="box"></div>
    <script>
        $(function () {
            $("#showBtn").on("click", function () {
                $("#box").show();
            });

            $("#hideBtn").on("click", function () {
                $("#box").hide();
            });

            $("#fadeInBtn").on("click", function () {
                $("#box").fadeIn(1000); // 1秒
            });

            $("#fadeOutBtn").on("click", function () {
                $("#box").fadeOut(1000); // 1秒
            });
        });
    </script>
</body>

</html>
